services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - "CMD-SHELL"
        - "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_listener 5672"
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  worker:
    build: ./worker
    environment:
      AMQP_URL: amqp://user:password@rabbitmq:5672/
      DB_DSN: postgresql+asyncpg://user:password@postgres:5432/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./api
    environment:
      AMQP_URL: amqp://user:password@rabbitmq:5672/
      DB_DSN: postgresql+asyncpg://user:password@postgres:5432/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped

  notifier:
    build: ./notifier
    environment:
      AMQP_URL: amqp://user:password@rabbitmq:5672/
    ports:
      - "8001:8001"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  analytics:
    build: ./analytics
    environment:
      AMQP_URL: amqp://user:password@rabbitmq:5672/
    ports:
      - "8002:8002"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq_data: